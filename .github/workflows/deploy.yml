name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- CV : les 2 YAML -> PDF via RenderCV, copiés dans public/ avant le build Astro ---
      # NOTE : premier vrai contenu (Phase 1), schéma RenderCV pas encore validé par un run
      # réel (Python indisponible en local). Non-bloquant (continue-on-error) tant que ce
      # premier passage n'a pas confirmé la syntaxe — à retirer une fois validé.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render CV (papier + numérique, non-bloquant au premier passage)
        continue-on-error: true
        run: |
          pip install "rendercv[full]"
          mkdir -p public/cv
          rendercv render cv/louis_bich_numerique.yaml --output-folder-name rendercv-output-numerique || true
          rendercv render cv/louis_bich_papier.yaml --output-folder-name rendercv-output-papier || true
          cp rendercv-output-numerique/*.pdf public/cv/louis-bich-cv.pdf 2>/dev/null || echo "PDF numérique non généré — étape ignorée."
          cp rendercv-output-papier/*.pdf public/cv/louis-bich-cv-papier.pdf 2>/dev/null || echo "PDF papier non généré — étape ignorée."

      # --- Site : build Astro ---
      - uses: withastro/action@v6

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
